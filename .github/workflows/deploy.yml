name: Deploy to Loop

# Managed by Loop. Do NOT edit this file — the Loop API re-validates your
# framework at deploy time, and changes here will break or lock out deploys.

on:
  push:
    branches: [main]

# OIDC: lets this job mint a short-lived token GitHub signs and the Loop API
# verifies. Removing `id-token: write` breaks authentication — leave it.
permissions:
  id-token: write
  contents: read

concurrency:
  group: loop-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v5 of these actions runs on the runner's Node 24; the v4 releases target
      # Node 20, which GitHub deprecated and now force-runs on 24 with a warning.
      # lfs: true pulls the real bytes for anything in design/assets/ — without
      # it those files check out as tiny LFS pointer text, not the media itself.
      - uses: actions/checkout@v5
        with:
          lfs: true

      # No `cache: npm` and `npm install` rather than `npm ci`: a fresh project
      # has no package-lock.json, and both of those hard-fail without one. Once
      # you commit a lockfile, `npm install` honours it.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Fast local guard before burning build minutes. The Loop API re-checks
      # this server-side at deploy time at the attested commit SHA — this step
      # is only quick feedback, not the security boundary.
      - name: Verify framework dependency
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(!d['hono']){console.error('::error::Missing required dependency hono');process.exit(1)}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Gates before the build: a type error or a failing test stops the deploy
      # rather than shipping a broken site. Fix the code, don't skip the test.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches a stale src/assets.ts (forgot to run `npm run assets`) or an
      # oversized/unsupported file in design/assets/ before anything uploads.
      - name: Check design assets
        run: npm run assets:check

      # --dry-run bundles the Worker WITHOUT deploying it, so no hosting
      # credentials are ever present on this runner. Loop pushes the artifact.
      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

      # Uploads design/assets/ BEFORE the Worker goes live, so the deployed app
      # never references an object that isn't there yet. Same OIDC token as the
      # deploy step below, minted fresh here since each step is a new shell.
      - name: Sync design assets
        env:
          WORKER_API_URL: "https://workers.loop.sv-academy.org"
        run: |
          set -euo pipefail
          if [ ! -d design/assets ]; then exit 0; fi
          shopt -s globstar nullglob
          FILES=(design/assets/**/*)
          if [ ${#FILES[@]} -eq 0 ]; then exit 0; fi
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$WORKER_API_URL" | jq -r '.value')
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue
            REL="${f#design/assets/}"
            URL=$(curl -sSf -G -H "Authorization: Bearer $OIDC" \
              --data-urlencode "path=$REL" \
              "$WORKER_API_URL/api/v1/projects/deploy/assets/upload-url" | jq -r '.url')
            curl -sSf -X PUT --upload-file "$f" \
              -H "content-type: $(file -b --mime-type "$f")" "$URL"
          done

      # All in one step so the OIDC token never leaves the runner step.
      - name: Deploy to Loop
        env:
          WORKER_API_URL: "https://workers.loop.sv-academy.org"
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$WORKER_API_URL" | jq -r '.value')
          RESP=$(curl -sSf -H "Authorization: Bearer $OIDC" \
            "$WORKER_API_URL/api/v1/projects/deploy/upload-url")
          UPLOAD_URL=$(echo "$RESP" | jq -r '.url')
          KEY=$(echo "$RESP" | jq -r '.key')
          curl -sSf -X PUT --upload-file dist/index.js \
            -H "content-type: application/javascript+module" "$UPLOAD_URL"
          curl -sSf -X POST \
            -H "Authorization: Bearer $OIDC" \
            -H "content-type: application/json" \
            -d "{\"r2_artifact_key\":\"$KEY\"}" \
            "$WORKER_API_URL/api/v1/projects/deploy"
